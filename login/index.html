  /* Icons: one shared set in /assets/icons.svg, placed with <svg data-ico="name"><use href="/assets/icons.svg#name"/></svg>.
     Line work is currentColor. --icon-spot is the soft rounded-square spot behind the feature icons: by default a pale
     tint of the line colour; the dark-green icons on light sections use pale mint (and dark lavender pale lavender). */
  :root { --icon-spot: rgba(140,238,209,0.18); }
  @supports (color: color-mix(in srgb, red 50%, transparent)) { :root { --icon-spot: color-mix(in srgb, currentColor 18%, transparent); } }
  /* Keyboard focus: a clear mint ring on anything reached with Tab (mouse clicks don't show it) */
  :where(a[data-nav], [role="button"][tabindex], [role="menuitem"][tabindex]):focus-visible { outline: 2px solid #3DD3AC; outline-offset: 3px; border-radius: 6px; }
  :where(a[data-nav], [role="button"][tabindex], [role="menuitem"][tabindex]):focus:not(:focus-visible) { outline: none; }
  [data-ico] { display: block; flex: none; overflow: visible; }
  [data-ico="arrow"] { width: 1.1em; height: 1.1em; }
  [data-icotile] { flex: none; width: 40px; height: 40px; display: flex; }
  [data-icotile="green"] { color: #11705B; --icon-spot: rgba(140,238,209,.45); }
  [data-icotile="mint"] { color: #8CEED1; }
  [data-icotile="lav"] { color: #D8B0F8; }
  [data-lg-arrow] { display: inline-block; vertical-align: -0.15em; }
  [data-lg-arrow][data-back] { margin-right: .3em; }
  [data-ico][data-flip] { transform: scaleX(-1); }
  /* Arrow hover: a small nudge to the right that settles back */
  @keyframes dpl-nudge { 0% { transform: translateX(0); } 35% { transform: translateX(3px); } 65% { transform: translateX(-0.5px); } 100% { transform: translateX(0); } }
  @media (prefers-reduced-motion: reduce) { [data-cta] > span, [data-textlink] > span, [data-reachnote] > span, [data-cf-go], [data-solarrow] { animation: none !important; } }

<style>
  html { scroll-behavior: auto; scrollbar-gutter: stable; }
  body { margin: 0; background: #FAF9F6; color: #171717; font-family: Archivo, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  * { box-sizing: border-box; }
  a { color: #171717; text-decoration: underline; text-decoration-color: #11705B; text-underline-offset: 3px; }
  /* Page links (real <a href>, see navTo) keep the look of the boxes they replaced. This comes after the "a" rule
     above and weighs the same (a:where() counts as just "a"), so it beats it, while every rule written for the
     element itself (buttons, menu rows, cards) still wins */
  a:where([data-nav]) { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a:where([data-nav="block"]) { display: block; }
  @media (hover: hover) { /* Plain text links only: page links (buttons, menu rows, cards: a[data-nav]) keep their own hover colours */
  a:not([data-nav]):hover { color: #3D3D3D; text-decoration-color: #2E9B7F; } }
  input, textarea, button, select { font-family: inherit; }
  /* Method hero: the comparison grid and phone animation (formerly the home hero) */
  @keyframes dpl-device-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes dpl-cursor { 0% { opacity: 0; transform: translate(111px, 245px); } 8% { opacity: 1; } 26% { transform: translate(111px, 245px) scale(1); } 30% { transform: translate(111px, 245px) scale(0.78); } 36% { transform: translate(111px, 245px) scale(1); } 58% { transform: translate(17px, 366px) scale(1); } 63% { transform: translate(17px, 366px) scale(0.78); } 69% { transform: translate(17px, 366px) scale(1); } 92% { transform: translate(111px, 411px) scale(1); opacity: 1; } 100% { transform: translate(111px, 411px) scale(0.78); opacity: 0; } }
  @keyframes dpl-caret { 50% { opacity: 0; } }
  @keyframes dpl-marker-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes dpl-row-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes dpl-bar-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* Home hero art: the dashboard's three drifting Dapple bubbles on a faint dot grid */
  [data-dplart] { position: relative; width: min(100%, clamp(320px, 24vw, 460px)); aspect-ratio: 1 / 0.9; isolation: isolate; }
  [data-dplart]::before { content: ""; position: absolute; inset: -6%; z-index: -1; background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1.4px); background-size: 16px 16px; -webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent); }
  [data-orb] { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; animation: dpl-hfloat 14s ease-in-out infinite alternate; }
  [data-orb="1"] { width: 62%; aspect-ratio: 1; left: 4%; top: 22%; background: rgba(61,211,172,0.30); }
  [data-orb="2"] { width: 47%; aspect-ratio: 1; left: 37%; top: 4%; background: rgba(216,176,248,0.20); animation-duration: 17s; animation-delay: -6s; }
  [data-orb="3"] { width: 38%; aspect-ratio: 1; left: 50%; top: 52%; background: rgba(239,250,119,0.14); animation-duration: 20s; animation-delay: -12s; }
  @keyframes dpl-hfloat { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(22px, -18px) scale(1.06); } 100% { transform: translate(-18px, 16px) scale(0.95); } }
  /* Home "Questions" scroll story: a funnel fills tier by tier as you scroll, while the matching question opens on the left */
  [data-fq-mark] { flex: none; width: 14px; height: 14px; border-radius: 4px; opacity: 0.35; transition: opacity 400ms ease; }
  [data-fq-title] { font-size: clamp(19px, 1.5vw, 24px); font-weight: 600; letter-spacing: -0.02em; color: #A8A8A4; transition: color 400ms ease; }
  [data-fq-item][data-reached] [data-fq-mark] { opacity: 1; }
  [data-fq-item][data-reached] [data-fq-title] { color: #171717; }
  [data-fq-body] { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 500ms cubic-bezier(0.2,0.8,0.2,1), opacity 400ms ease; }
  [data-fq-body] > div { overflow: hidden; }
  /* Method "What we measure": example methods under each open question, as tags in the style of Plans' "You get"
     tags, in the light page's green. The description and tags share one wrapper (data-fq-bwrap), which is what the
     story layout measures for the open item's height */
  [data-fq-methods] { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 0 0 30px; }
  [data-fq-mlabel] { flex-basis: 100%; margin: 0 0 2px; font-size: 12.5px; font-weight: 500; color: #8A8A86; }
  [data-fq-mtag] { font-size: 13px; font-weight: 500; padding: 5px 11px; border: 1px solid rgba(17,112,91,0.3); border-radius: 999px; white-space: nowrap; color: #11705B; }
  [data-fq-item][data-active] [data-fq-body] { grid-template-rows: 1fr; opacity: 1; }
  /* Each funnel tier shares a grid row with its question, so it is always level with it and grows when it opens */
  [data-fq-tier] { position: relative; justify-self: center; width: min(100%, 560px); margin: 4px 0; background: #EFEDE7; transition: opacity 400ms ease; }
  [data-fq-fill] { position: absolute; left: 0; right: 0; top: 0; height: 0; }
  [data-fq-label] { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(16px, 1.3vw, 21px); font-weight: 600; letter-spacing: -0.01em; color: #171717; opacity: 0; transition: opacity 400ms ease; }
  [data-fq-tier][data-reached] [data-fq-label] { opacity: 1; }
  /* The questions and tiers are always clickable (see fqOpen). Once the funnel is full the questions work as
     an accordion, and the open one's tier stays bright */
  [data-fq-head], [data-fq-tier] { cursor: pointer; }
  /* Hover colours only for a real mouse: on touch screens a tap would leave them stuck on until the next tap */
  @media (hover: hover) {
    [data-fq-head]:hover [data-fq-title], [data-fq-head]:hover [data-fq-chev] { color: #11705B; }
    [data-storydark] [data-fq-head]:hover [data-fq-title], [data-storydark] [data-fq-head]:hover [data-fq-chev] { color: #8CEED1; }
    [data-storydark][data-screen-label^="Focus"] [data-fq-head]:hover [data-fq-title], [data-storydark][data-screen-label^="Focus"] [data-fq-head]:hover [data-fq-chev] { color: #D8B0F8; }
  }
  /* A chevron on the right of each question shows it opens; it turns over when the question is open */
  [data-fq-chev] { margin-left: auto; flex: none; display: flex; color: #8A8A86; transition: transform 300ms cubic-bezier(0.2,0.8,0.2,1), color 200ms; }
  [data-fq-item][data-active] [data-fq-chev] { transform: rotate(180deg); color: #171717; }
  [data-story][data-fq-picked] [data-fq-tier]:not([data-on]) { opacity: 0.4; }
  /* Product pages, "what you receive": the home funnel's scroll story on charcoal, with a visual per item in place of

  [data-storydark] [data-fq-title] { color: #6E6E6A; }
  [data-storydark] [data-fq-item][data-reached] [data-fq-title] { color: #FFFFFF; }
  [data-storydark] [data-fq-item][data-active] [data-fq-chev] { color: #FFFFFF; }
  [data-fq-visual] { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: grid; }
  /* Swipe tiles: phones only (see the phone rules) */
  [data-fq-slides] { display: none; }
  /* Visual stories: the items sit in rows 2-4 between two flexible rows, so a visual taller than the list

  [data-storyvis] [data-fq-grid] { grid-template-rows: 1fr auto auto auto 1fr; }

  [data-fq-vis] { grid-area: 1 / 1; opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity 450ms ease, transform 500ms cubic-bezier(0.2,0.8,0.2,1), visibility 0s linear 450ms; }
  [data-fq-vis][data-on] { opacity: 1; visibility: visible; transform: none; transition: opacity 450ms ease, transform 500ms cubic-bezier(0.2,0.8,0.2,1), visibility 0s; }
  /* "What you receive" previews: each item is shown as a small product screen, tilted like a launch shot. Everything

  [data-scr] { container-type: inline-size; perspective: 2200px; padding: 2% 3% 4% 2%; position: relative; }
  [data-scr]::before { content: ""; position: absolute; inset: 20% 6% -2% 14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(140,238,209,0.13), rgba(140,238,209,0)); filter: blur(28px); pointer-events: none; }
  [data-screen-label^="Focus"] [data-scr]::before { background: radial-gradient(closest-side, rgba(216,176,248,0.13), rgba(216,176,248,0)); }
  [data-scr-tilt] { position: relative; font-size: calc(100cqw / 86); aspect-ratio: 16 / 10; display: flex; flex-direction: column; overflow: hidden; border-radius: 1.2em; background: #111312; border: 1px solid #2E3331; color: #F1F1EE; line-height: 1.35; box-shadow: 0 0 0 0.55em #1A1D1C, 0 0 0 calc(0.55em + 1px) #333836, 2.5em 4em 6em -1.5em rgba(0,0,0,0.75); transform: rotateY(-14deg) rotateX(6deg) rotateZ(0.8deg); transform-origin: 40% 50%; transition: transform 900ms cubic-bezier(0.2,0.8,0.2,1); }
  [data-fq-vis]:not([data-on]) [data-scr-tilt] { transform: rotateY(-24deg) rotateX(9deg) rotateZ(1.5deg) translateX(4%); }

  /* The pin centres its content using the tallest state, measured by centreStory() as --fq-tall. Until it is
     measured this works out at var(--sec). It follows the header slimming down by itself. */
  [data-story] { --fq-tall: calc(calc(100vh / var(--z)) - var(--hdr) - 2 * var(--sec)); }
  /* A story straight after a black hero (Method): its margin takes off the pin's top padding, so the
     heading lands --herogap under the hero like the other pages' first headings. It uses the slim header's

  [data-story][data-herogap] { margin-top: calc(var(--herogap) - max(16px, (calc(100vh / var(--z)) - clamp(58px, 3.4vw, 68px) - var(--fq-tall)) / 2)); }
  [data-story][data-storyvis]:not([data-herogap]) { margin-top: calc(var(--sec) - max(16px, (calc(100vh / var(--z)) - clamp(58px, 3.4vw, 68px) - var(--fq-tall)) / 2)); margin-bottom: calc(var(--sec) - max(16px, (calc(100vh / var(--z)) - clamp(58px, 3.4vw, 68px) - var(--fq-tall)) / 2)); }
  [data-story-pin] { padding-top: max(16px, (calc(100vh / var(--z)) - var(--hdr) - var(--fq-tall)) / 2); padding-top: round(max(16px, (calc(100vh / var(--z)) - var(--hdr) - var(--fq-tall)) / 2), 1px); }
  /* Big screens: past 1920px wide the whole page scales up evenly (like browser zoom), reaching 120% on a

  :root { --z: 1; zoom: var(--z); }

  /* Content sits in front of the dots, so tinted fills on the dark sections are given as the solid colour
     they make on #171717; otherwise the dots would show through them */
  /* (the runtime rewrites inline colours with spaces, so both spellings are matched) */
  [data-dotfield] [style*="background: rgba(140,238,209,0.14)"], [data-dotfield] [style*="background: rgba(140, 238, 209, 0.14)"] { background: #273531 !important; }
  [data-dotfield] [style*="background: rgba(216,176,248,0.14)"], [data-dotfield] [style*="background: rgba(216, 176, 248, 0.14)"] { background: #322C37 !important; }
  /* Home spacing: every light section gap is 2 x --sec (one section's bottom padding plus the next one's top),
     scaled to the screen height so each section fits on one screen, laptops included */
  /* Shared hero spacing, so every page lines up: full-screen heroes centre their content a little above
     the middle (--herotop / --herobot), and on pages that turn light after a black hero the first heading

  :root { --herotop: clamp(16px, calc(3vh / var(--z)), 40px); --herobot: calc(var(--herotop) + 64px); --herogap: calc(2 * clamp(64px, calc(10vh / var(--z)), 132px)); }
  :root { --sec: clamp(64px, calc(10vh / var(--z)), 132px); --hdr: clamp(76px, 4.6vw, 92px); --hdr-full: clamp(76px, 4.6vw, 92px); --logo-h: clamp(34px, 2.2vw, 42px); }
  /* Product pages: the "what it reveals" points as tiles in the home style (outlined on the page colour,
     icon and title in a row), but not links */
  [data-infogrid] { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: clamp(16px, 1.8vw, 28px); }
  [data-infotile] { display: flex; flex-direction: column; gap: 14px; padding: clamp(24px, 2.4vw, 36px); border-radius: 20px; border: 1px solid #2E2E2E; }

  [data-infoicon] { flex: none; width: 40px; height: 40px; color: #11705B; --icon-spot: rgba(140,238,209,.45); display: flex; align-items: center; justify-content: center; }
  /* Product pages: "Three moments" with the headline on the left and the three uses as rows on the right */
  /* Product pages, "how it runs": each stage gets most of a screen to itself (like Revolut's feature sections),

  [data-stagerow] { position: relative; padding: clamp(40px, calc(7vh / var(--z)), 96px) 0; box-sizing: border-box; }

  [data-sfwrap] { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(40px, 6vw, 120px); align-items: start; }

  /* About: numbered principles, and the track record as big green numbers like the home page's stats */

  /* About, "Experience that travels across markets": the home page's three stats, with the industries and countries

  [data-reachtags] { display: flex; flex-direction: column; gap: 6px; margin-top: 20px; }

  /* The three columns share rows (subgrid), so the note's box lines up exactly with the tags beside it: its top

  /* Plans page */
  /* Plans hero: the tiers as one outlined pyramid, Track at the base. The outline draws itself, then the bands,
     labels and tags fade in from the base up */
  [data-pyband], [data-pylabel] { opacity: 0; transition: opacity 550ms ease; }
  [data-pyramid][data-in="1"] [data-pyband], [data-pyramid][data-in="1"] [data-pylabel] { opacity: 1; }
  [data-pysplit] { stroke: #8CEED1; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 4 5; }
  [data-pyname] { font-family: inherit; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; fill: #FFFFFF; }
  [data-pyleader] { stroke: #3A3A3A; stroke-width: 1; }
  [data-pytag] { font-family: inherit; font-size: 19px; font-weight: 500; fill: #D6D6D2; }
  /* Tier cards: the same four parts in each (heading, best when, includes, you get), lined up across the row
     with subgrid. Track is solid; the add-ons are dashed, with a "+" and "Per journey" */
  [data-plangrid] { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); gap: 0 clamp(12px, 1.2vw, 20px); }
  [data-plantier] { grid-row: span 5; display: grid; grid-template-rows: subgrid; row-gap: 0; padding: clamp(22px, 2vw, 32px); border-radius: 22px; background: #1D1D1D; border: 1px solid #2E2E2E; }
  [data-plantier][data-addon] { background: transparent; border: 1.5px dashed #555555; }
  [data-dotfield] [data-plantier][data-addon] { background: #171717; }
  [data-tierhead] { display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
  [data-plantier-name] { font-size: clamp(26px, 2.2vw, 34px); font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 6px; }
  [data-planplus] { color: #8CEED1; font-weight: 500; }
  [data-plantier-desc] { font-size: 17px; line-height: 1.45; color: #BEBEBE; margin: 0; }
  [data-tierpart], [data-tierout] { display: flex; flex-direction: column; gap: 10px; padding: 18px 0; border-top: 1px solid #2E2E2E; }
  [data-tierlabel] { font-size: 12.5px; font-weight: 500; color: #8A8A86; }
  /* Plans: each card section holds a Pattern and a Focus version. Both share one cell (the one not shown is
     invisible rather than removed), so every section, and so every card, is as long as its longer version and
     nothing changes length when the switch flips. */
  [data-plantier] :is([data-tierpart], [data-tierout]):has(> [data-only="snap"]):has(> [data-only="focus"]) { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 10px; align-content: start; }
  [data-plantier] :is([data-tierpart], [data-tierout]):has(> [data-only="focus"]) > [data-only] { grid-column: 1; grid-row: 1; }
  [data-plantier] :is([data-tierpart], [data-tierout]):has(> [data-tierlabel]):has(> [data-only="focus"]) > [data-only] { grid-row: 2; }
  [data-plansec][data-tone="mint"] [data-plantier] [data-tierpart] > [data-only="focus"], [data-plansec][data-tone="lav"] [data-plantier] [data-tierpart] > [data-only="snap"] { display: block !important; visibility: hidden; }
  [data-plansec][data-tone="mint"] [data-plantier] [data-tierpart] > [data-only="focus"][data-tiercad], [data-plansec][data-tone="lav"] [data-plantier] [data-tierpart] > [data-only="snap"][data-tiercad] { display: flex !important; }
  [data-plansec][data-tone="mint"] [data-plantier] [data-tierout] > [data-only="focus"], [data-plansec][data-tone="lav"] [data-plantier] [data-tierout] > [data-only="snap"] { display: flex !important; visibility: hidden; }
  [data-tieruse] { font-size: 16px; line-height: 1.5; color: #F4F4F2; margin: 0; }

  /* 5th row. Track: "Cadence options" drawn as a range, a line that strengthens from occasional to frequent with a
     marker at each option (a picture of the range, not a control). Diagnose and Advise: a bold suggestion and why. */
  [data-tiercad] { display: flex; flex-direction: column; gap: 10px; }

  [data-tierout] > [data-only] { flex: 1; }

  [data-plansec][data-tone="lav"] [data-tiertag] { color: #D8B0F8; border-color: rgba(216,176,248,0.35); }

  [data-perjourney] { color: #8CEED1; border: 1px dashed rgba(140,238,209,0.55); }
  [data-planbase] { color: #A8A8A4; border: 1px solid #3A3A3A; }
  /* Pattern / Focus switch above the tier cards. Only the chosen product's wording and example show; with
     Focus chosen, this section's mint accents turn lavender */
  [data-plantoggle] { display: flex; justify-content: center; gap: 4px; width: max-content; max-width: 100%; margin: 0 auto clamp(28px, 2.6vw, 44px); padding: 5px; border-radius: 999px; background: #1D1D1D; border: 1px solid #2E2E2E; }
  [data-plantoggle-opt] { padding: 10px 22px; border-radius: 999px; cursor: pointer; font-size: 17px; color: #A8A8A4; transition: background .25s, box-shadow .25s; }

  [data-plansec][data-tone="lav"] [data-plantoggle-opt="focus"] { background: #322C37; box-shadow: inset 0 0 0 1px rgba(216,176,248,0.45); }
  [data-plansec][data-tone="mint"] [data-plantoggle-opt="snap"] [data-wordmark], [data-plansec][data-tone="lav"] [data-plantoggle-opt="focus"] [data-wordmark] { opacity: 1; }
  [data-plansec][data-tone="mint"] [data-only="focus"], [data-plansec][data-tone="lav"] [data-only="snap"] { display: none !important; }
  [data-only] { animation: dpl-swap 350ms ease both; }
  @keyframes dpl-swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  [data-tierout] > [data-only] { display: flex; flex-direction: column; gap: 10px; }
  [data-plansec][data-tone="lav"] [data-accent], [data-plansec][data-tone="lav"] [data-planplus], [data-plansec][data-tone="lav"] [data-tierout] b { color: #D8B0F8 !important; }

  /* The example under the cards: the chosen product's journey-by-tier grid, text on the left */
  [data-planscope] { margin-top: clamp(12px, 1.2vw, 20px); display: grid; }
  /* Plans page: the switch sits above the tier cards and stays pinned, small and quiet, while they scroll past; its
     wrapper ends with the cards, so it lets go there. data-stuck is set by onScroll (toggleStuck) */
  [data-plantogglewrap] [data-plantoggle] { position: sticky; top: calc(var(--hdr) + 12px); z-index: 6; transform-origin: 50% 0; transition: transform 350ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 350ms ease, background 350ms ease, top 250ms ease; }
  /* Desktop: when the header grows back on the way up, the switch moves down with it (same gap, same 250ms) */
  @media (min-width: 900px) { :root[data-nav-up] [data-plantogglewrap] [data-plantoggle] { top: calc(var(--hdrbar) + 12px); } }
  [data-plantogglewrap] [data-plantoggle][data-stuck] { transform: scale(0.78); background: rgba(29,29,29,0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 12px 30px -10px rgba(0,0,0,0.7); }
  /* Both examples sit in the same spot and the hidden one keeps its space, so the panel is the same height for

  [data-plansec][data-tone="mint"] [data-planscope] > [data-only="focus"], [data-plansec][data-tone="lav"] [data-planscope] > [data-only="snap"] { display: grid !important; visibility: hidden; }

  /* Contact enquiry (contactFlow): a fork, then one step per screen with chips, cards and a progress bar */

  /* Products menu: a dark panel with a tile per product in its own colour; hover lifts the tile's border and

        h('span', { role: 'button', tabIndex: 0, 'data-emaillink': true, 'aria-haspopup': 'menu', 'aria-expanded': open ? 'true' : 'false', onClick: this.openEmailForm }, 'contact@dapple.ie'),
        open ? h('span', { 'data-emailmenu': true, 'data-up': true, role: 'menu' },
          h('span', { role: 'menuitem', tabIndex: 0, 'data-emailitem': true, onClick: this.copyEmail }, ico('copy', 16), this.state.emailCopied ? 'Copied' : 'Copy address'),
          h('a', { href: 'https://mail.google.com/mail/?view=cm&fs=1&to=contact@dapple.ie', target: '_blank', rel: 'noopener', role: 'menuitem', 'data-emailitem': true }, ico('external', 16), 'Open in Gmail'),
          h('a', { href: 'https://outlook.office.com/mail/deeplink/compose?to=contact@dapple.ie', target: '_blank', rel: 'noopener', role: 'menuitem', 'data-emailitem': true }, ico('external', 16), 'Open in Outlook'),
          h('a', { href: 'mailto:contact@dapple.ie', role: 'menuitem', 'data-emailitem': true, 'data-mailapp': true }, ico('mail', 16), 'Open my email app')) : null);

    // Send steps: the privacy line sits right under the fields; the send button keeps Continue's place
    const sendFoot = label => [
      h('input', { key: 'hp', type: 'checkbox', id: 'cf-hp', name: 'botcheck', tabIndex: -1, autoComplete: 'off', 'aria-hidden': 'true', 'data-cf-hp': true }),
      // A failed send shows its message in the privacy line's place, so the tile doesn't change height and jump
      cf.error
        ? h('p', { key: 'err', role: 'alert', 'data-cf-privacy': true, 'data-cf-note': 'err' }, 'Sorry, that didn’t send. Please try again, or email us at ', emailMenu(), '.')
        : h('p', { key: 'pv', 'data-cf-privacy': true }, 'We’ll only use your details to respond to this enquiry. ',
          // Opens in a new tab, so reading it never loses the form's progress
          h('a', { href: '/privacy/', target: '_blank', rel: 'noopener' }, 'Privacy notice')),
      nav({ send: label })
    ];

    if (cf.done) {
      const quote = cf.path === 'quote', rows = quote ? this.cfRows().filter(r => r[1]) : [];
      return h('div', { 'data-cf': true, 'data-cf-thanks': true, key: 'done' },
        closeX('Close and start a new enquiry'),
        // The logo's three dots spin in, settle into place and fade back as a tick draws across them
        h('div', { 'data-cf-tick': true, 'aria-hidden': 'true' },
          h('svg', { width: 96, height: 96 },
            h('g', { 'data-cf-dots': true }, h('circle', { cx: 38, cy: 47, r: 23 }), h('circle', { cx: 59, cy: 34, r: 16 }), h('circle', { cx: 59, cy: 61, r: 15 })),
            h('path', { 'data-cf-check': true, d: 'M33 49l10 10 20-22', fill: 'none' }))),
        h('h2', { 'data-cf-head': true, tabIndex: -1 }, 'Enquiry sent'),
        h('p', { 'data-cf-msg': true }, quote
          ? 'Thanks for reaching out. We’ll be in touch shortly with a price.'
          : 'Thanks for reaching out. We’ll be in touch shortly to set up a chat.'),
        rows.length ? h('dl', { 'data-cf-summary': true, 'aria-label': 'Your answers' }, rows.map(([k, v]) => [h('dt', { key: k + 't' }, k), h('dd', { key: k + 'd' }, v)])) : null);
    }
    if (!cf.path) {
      return h('div', { 'data-cf': true, key: 'fork' },
        h('h2', { 'data-cf-head': true, tabIndex: -1 }, 'How can we help?'),
        h('div', { 'data-cf-fork': true },
          h('button', { type: 'button', 'data-cf-card': true, onClick: () => this.cfStart('discovery') }, h('span', { 'data-cf-cardtext': true }, h('b', null, 'I’d like to learn more'), h('span', null, 'A short chat about your needs and whether we’re a fit.')), h('span', { 'data-cf-go': true, 'aria-hidden': 'true' }, h('svg', { 'data-ico': 'arrow', 'aria-hidden': 'true' }, h('use', { href: '/assets/icons.svg#arrow' })))),
          h('button', { type: 'button', 'data-cf-card': true, onClick: () => this.cfStart('quote') }, h('span', { 'data-cf-cardtext': true }, h('b', null, 'I know what I need'), h('span', null, 'Tell us your scope and we’ll come back with a price.')), h('span', { 'data-cf-go': true, 'aria-hidden': 'true' }, h('svg', { 'data-ico': 'arrow', 'aria-hidden': 'true' }, h('use', { href: '/assets/icons.svg#arrow' }))))),
        h('p', { 'data-cf-or': true }, 'Or email us directly at ', emailMenu()));
    }

    // Discovery: one screen, no progress bar
    if (cf.path === 'discovery') {
      return h('div', { 'data-cf': true, key: 'discovery' }, closeX('Close this enquiry'),
        head('Let’s set up a chat'), field('email', 'Work email', { ac: 'email', focus: true, enter: this.cfSend }),
        field('role', 'Role', { ac: 'organization-title', enter: this.cfSend }),
        field('hope', 'What are you hoping to learn with Dapple?', { multi: true }), ...sendFoot('Submit'));
    }
    // Quote: five steps. Measure, login side and industry move on as soon as they're answered; from markets
    // on, Continue.
    const total = 5, step = Math.min(cf.step, total - 1);
    let body;
    if (step === 0) {
      body = [head('What do you want to measure?'), cards('measure', [
        { v: 'Pattern', sub: 'All my key journeys against a wide competitor set', tone: 'mint' },
        { v: 'Focus', sub: 'One journey against my closest competitors', tone: 'lav' }]),
        chips('measure', ['Not sure, recommend one for me'], { alt: true, advance: true }),
        nav({ skip: ['measure'], auto: true })];
    } else if (step === 1) {

        { v: 'Public', label: 'Public site', sub: 'The acquisition funnel: how you win new customers' },
        { v: 'Behind a login', label: 'Behind the login', sub: 'The member area: how you serve existing customers' },
        { v: 'Both', label: 'Both of the above' }]),
        nav({ skip: ['where'], auto: true })];
    } else if (step === 2) {
      body = [head('Which industry are you in?'),
        chips('industry', ['Banking', 'Betting & Gaming', 'Energy', 'Higher Education', 'Insurance', 'Retail', 'Telecoms', 'Travel', 'Wealth Management', 'Other'], { otherLine: true, advance: true, other: 'industryOther', placeholder: 'Your industry' }),
        // Choosing "Other" waits for the typed answer, so Continue appears in its usual place

    } else if (step === 3) {
      body = [head('Which markets?', 'Choose as many as you like.'),
        chips('markets', ['Australia', 'Brazil', 'Canada', 'Germany', 'Ireland', 'Italy', 'Spain', 'UK', 'US', 'Other'], { otherLine: true, multi: true, other: 'marketsOther', placeholder: 'Which ones?' }),
        // Continue appears once at least one market is ticked

    } else {
      body = [head('Your details'), field('email', 'Work email', { ac: 'email', focus: true, enter: this.cfSend }),

      ...body);
  }

  // Client login: a stand-in until the client dashboard exists (it will live elsewhere, e.g. app.dapple.ie).
  // It looks and behaves like a real sign-in, but there are no accounts: every attempt ends, after a short
  // "Logging in…", with the usual "incorrect email or password" message. Nothing typed here is sent or kept
  // anywhere; it lives only in the page's memory and is cleared on leaving the page.
  lgBlank() { return { view: 'login', email: '', password: '', show: false, tried: false, busy: false, failed: false }; }
  lgPatch(patch, focus) {
    this.setState(st => ({ lg: { ...st.lg, ...patch } }));
    if (focus) this._lgFocus = focus;
  }
  lgFocusNow() {
    const id = this._lgFocus;
    if (!id) return;
    this._lgFocus = null;
    const el = document.getElementById(id);
    if (el) el.focus();
  }
  lgSubmit = (e) => {
    if (e) e.preventDefault();
    const lg = this.state.lg;
    if (lg.busy) return;
    const em = this.cfEmailState(lg.email);
    if (em === 'empty' || em === 'bad' || (lg.view === 'login' && !lg.password)) {
      return this.lgPatch({ tried: true, failed: false }, em === 'empty' || em === 'bad' ? 'lg-email' : 'lg-password');
    }
    this.lgPatch({ busy: true, failed: false, tried: false });
    clearTimeout(this._lgT);
    this._lgT = setTimeout(() => {
      if (this.state.page !== 'login') return;
      if (this.state.lg.view === 'login') this.lgPatch({ busy: false, failed: true, password: '' }, 'lg-password');
      else this.lgPatch({ busy: false, view: 'sent' }, 'lg-head');
    }, this.state.lg.view === 'login' ? 1100 : 900);
  };
  loginFlow() {
    const h = React.createElement, lg = this.state.lg, em = this.cfEmailState(lg.email);
    const emailErr = lg.tried && (em === 'empty' ? 'Enter your email address.' : em === 'bad' ? 'Enter a valid email address.' : '');
    const pwErr = lg.tried && lg.view === 'login' && !lg.password && !emailErr ? 'Enter your password.' : '';
    const toView = view => () => this.lgPatch({ view, tried: false, failed: false, busy: false, password: '' }, view === 'login' ? 'lg-email' : 'lg-head');
    const head = (title, sub) => [
      h('h1', { key: 'h', id: 'lg-head', 'data-lg-head': true, tabIndex: -1 }, title),
      h('p', { key: 's', 'data-lg-sub': true }, sub)
    ];
    const emailField = h('div', { key: 'em', 'data-field': true },
      h('label', { htmlFor: 'lg-email' }, 'Email'),
      h('input', { id: 'lg-email', name: 'username', type: 'email', autoComplete: 'username', inputMode: 'email', autoCapitalize: 'none', spellCheck: false,
        value: lg.email, 'aria-invalid': emailErr ? 'true' : undefined, 'aria-describedby': emailErr ? 'lg-email-err' : undefined,
        onChange: e => this.lgPatch({ email: e.target.value }) }),
      emailErr ? h('p', { id: 'lg-email-err', 'data-cf-note': 'err' }, emailErr) : null);
    const button = (label, busyLabel) => h('button', { key: 'go', type: 'submit', 'data-cta': 'mint', 'data-lg-submit': true, disabled: lg.busy },
      lg.busy ? [h('span', { key: 'sp', 'data-lg-spin': true, 'aria-hidden': 'true' }), busyLabel] : label);

    if (lg.view === 'sent') {
      return h('div', { 'data-lg': true, key: 'sent' },
        h('div', { 'data-cf-tick': true, 'aria-hidden': 'true' }, h('svg', { 'data-ico': 'done', width: '100%', height: '100%', 'aria-hidden': 'true' }, h('use', { href: '/assets/icons.svg#done' }))),
        head('Check your inbox', 'If an account exists for ' + lg.email.trim() + ', you’ll get an email with a link to reset your password in the next few minutes.'),
        h('button', { type: 'button', 'data-lg-link': true, onClick: toView('login') }, h('span', { 'data-lg-arrow': true, 'data-back': true, 'aria-hidden': 'true' }, h('svg', { 'data-ico': 'arrow', 'data-flip': true, 'aria-hidden': 'true' }, h('use', { href: '/assets/icons.svg#arrow' }))), 'Back to login'));
    }
    if (lg.view === 'reset') {
      return h('form', { 'data-lg': true, key: 'reset', noValidate: true, onSubmit: this.lgSubmit },
        head('Reset your password', 'Enter the email you log in with and we’ll send you a link to reset your password.'),
        emailField, button('Send reset link', 'Sending…'),
        h('button', { key: 'back', type: 'button', 'data-lg-link': true, onClick: toView('login') }, h('span', { 'data-lg-arrow': true, 'data-back': true, 'aria-hidden': 'true' }, h('svg', { 'data-ico': 'arrow', 'data-flip': true, 'aria-hidden': 'true' }, h('use', { href: '/assets/icons.svg#arrow' }))), 'Back to login'));
    }
    return h('form', { 'data-lg': true, key: 'login', noValidate: true, onSubmit: this.lgSubmit },
      head('Login', 'Access your results in the Dapple dashboard.'),
      lg.failed ? h('div', { key: 'fail', role: 'alert', 'data-lg-alert': true },
        h('svg', { 'data-ico': 'alert', width: 18, height: 18, 'aria-hidden': 'true' }, h('use', { href: '/assets/icons.svg#alert' })),
        h('span', null, 'The email or password you entered is incorrect. Please try again.')) : null,
      emailField,
      h('div', { key: 'pw', 'data-field': true },
        h('div', { 'data-lg-labelrow': true }, h('label', { htmlFor: 'lg-password' }, 'Password'),
          h('button', { type: 'button', 'data-lg-link': true, onClick: toView('reset') }, 'Forgot password?')),
        h('div', { 'data-lg-pw': true },
          h('input', { id: 'lg-password', name: 'password', type: lg.show ? 'text' : 'password', autoComplete: 'current-password',
            value: lg.password, 'aria-invalid': pwErr ? 'true' : undefined, 'aria-describedby': pwErr ? 'lg-pw-err' : undefined,
            onChange: e => this.lgPatch({ password: e.target.value }) }),
          h('button', { type: 'button', 'data-lg-show': true, 'aria-pressed': lg.show ? 'true' : 'false', 'aria-label': lg.show ? 'Hide password' : 'Show password',
            onClick: () => this.lgPatch({ show: !lg.show }) }, lg.show ? 'Hide' : 'Show')),
        pwErr ? h('p', { id: 'lg-pw-err', 'data-cf-note': 'err' }, pwErr) : null),
      button('Log in', 'Logging in…'),
      h('p', { key: 'new', 'data-lg-new': true }, 'New to Dapple? ',
        h('a', { href: '/contact/', onClick: e => { e.preventDefault(); this.go('contact'); } }, 'Let’s talk ', h('span', { 'data-lg-arrow': true, 'aria-hidden': 'true' }, h('svg', { 'data-ico': 'arrow', 'aria-hidden': 'true' }, h('use', { href: '/assets/icons.svg#arrow' }))))));
  }

  renderVals() {
    const p = this.state.page;
    const step = this.state.step, settled = step >= 3;
    return {
      showDevice: p === 'method',
      showGrid: settled,
      showMarkers: step === 2,
      pressAttr: this.state.press ? 'true' : 'false',
      phonePlay: step === 1 || step === 2 ? 'true' : 'false',
      score: this.state.score,
      stageRef: this.stageRef,
      slotRef: this.slotRef,
      // On phones the phone scene (with its markers and cards, about 540px across) is shrunk to the screen width

        return {
        position: 'absolute',
        left: settled ? '0px' : `calc(50% - ${120 * k}px)`,
        top: settled ? ((this.state.landing || 205) + 'px') : '6px',
        width: '240px',
        transformOrigin: 'top left',
        // It shrinks into "Your Brand"'s thumbnail: 32px wide (24px in the compact phone table)
        transform: settled ? `scale(${narrow ? 0.0834 : 0.13})` : `scale(${k})`,
        // No glide until "Your Brand"'s slot has been measured, so the phone starts in its row on arrival
        opacity: this.state.landing ? 1 : 0,
        transition: this.state.landing ? 'left 900ms cubic-bezier(0.16,1,0.3,1), top 900ms cubic-bezier(0.16,1,0.3,1), transform 900ms cubic-bezier(0.16,1,0.3,1)' : 'none',
        zIndex: 4
        };
      })(),
      isHome: p === 'home',
      loginHref: window.DAPPLE_DASHBOARD_URL || '/login/',
      isBenchmark: p === 'benchmark',
      isTracking: p === 'tracking',
      isPlans: p === 'plans',
      isProducts: p === 'benchmark' || p === 'tracking',
      productsOpen: this.state.productsOpen,
      openProducts: () => this.setState({ productsOpen: true }),
      closeProducts: () => this.setState({ productsOpen: false }),
      // Hover opens the Solutions menu and leaving closes it; a click (or tap) also opens it
      toggleProducts: () => this.setState({ productsOpen: true }),
      isMethod: p === 'method',
      isAbout: p === 'about',
      isContact: p === 'contact',
      isPrivacy: p === 'privacy',
      ...(() => {
        // The header is black while the page under it is dark, and turns light only once light content scrolls
        // under it (so on all-charcoal pages it stays black all the way down). See navTone().
        const past = !!this.state.navLight;
        return {
          navLightAttr: past ? 'true' : 'false',
          navBg: past ? 'rgba(250,249,246,0.92)' : '#171717',
          navBorder: past ? '#E6E6E3' : '#303030',
          navInk: past ? '#3D3D3D' : '#D6D6D2',
          navAccent: past ? '#11705B' : '#8CEED1',
          navLogoWhite: past ? 0 : 1,
          navLogoFull: past ? 1 : 0,
          // "Let's talk": solid mint on the dark header, dark green once the header turns light
          navCta: past ? 'green' : 'mint'
        };
      })(),
      // Plans page: the Pattern / Focus switch above the tier cards
      planTone: this.state.planFocus ? 'lav' : 'mint',
      planSnapOn: this.state.planFocus ? 'false' : 'true',
      planFocusOn: this.state.planFocus ? 'true' : 'false',
      setPlanSnap: () => this.setState({ planFocus: false }),
      setPlanFocus: () => this.setState({ planFocus: true }),
      fqOpen0: this.fqOpen0, fqOpen1: this.fqOpen1, fqOpen2: this.fqOpen2,
      chartRef: this.chartRef, storyRef: this.storyRef, toggleRef: this.toggleRef, solRef: this.solRef, artRef: this.artRef, heroVideoRef: this.heroVideoRef, scopeVideoRef: this.scopeVideoRef,
      menuOpen: this.state.menuOpen, toggleMenu: this.toggleMenu,
      menuLogo: this.state.navLight ? 'logo.webp' : 'logo-white.webp',
      mmProducts: !!this.state.mmProducts, mmProductsAttr: this.state.mmProducts ? 'true' : 'false', toggleMenuProducts: this.toggleMenuProducts,
      goHomeMenu: e => this.navTo(e, 'home', true),
      goLoginMenu: e => this.navTo(e, 'login', true),
      goBenchmarkMenu: e => this.navTo(e, 'benchmark', true),
      goTrackingMenu: e => this.navTo(e, 'tracking', true),
      goPlansMenu: e => this.navTo(e, 'plans', true),
      goMethodMenu: e => this.navTo(e, 'method', true),
      goAboutMenu: e => this.navTo(e, 'about', true),
      goContactMenu: e => this.navTo(e, 'contact', true),
      chartOffset: this.state.chartIn ? 0 : 1000,
      chartDots: this.state.chartIn ? 1 : 0,
      // Focus hero: the change marker waits for the drawn line to reach it; on the way out it goes at once
      chgDelay: this.state.chartIn ? '540ms' : '0ms',
      chartReveal: this.state.chartIn ? 0 : 110,
      contactFlow: p === 'contact' ? this.contactFlow() : null,
      emailContactOpen: this.state.emailOpen === 'contact',
      emailFooterOpen: this.state.emailOpen === 'footer',
      openEmailContact: this.openEmailContact,
      openEmailFooter: this.openEmailFooter,
      copyEmail: this.copyEmail,
      emailCopyLabel: this.state.emailCopied ? 'Copied' : 'Copy address',
      goHome: e => this.navTo(e, 'home'),
      goBenchmark: e => this.navTo(e, 'benchmark'),
      goTracking: e => this.navTo(e, 'tracking'),
      goPlans: e => this.navTo(e, 'plans'),
      goMethod: e => this.navTo(e, 'method'),
      goAbout: e => this.navTo(e, 'about'),
      goContact: e => this.navTo(e, 'contact'),
      goPrivacy: e => this.navTo(e, 'privacy'),
      goLogin: e => this.navTo(e, 'login'),
      isLogin: p === 'login',
      loginFlow: p === 'login' ? this.loginFlow() : null,
      linkedinUrl: window.DAPPLE_LINKEDIN || '',
      hasLinkedin: !!window.DAPPLE_LINKEDIN
    };
  }
}
